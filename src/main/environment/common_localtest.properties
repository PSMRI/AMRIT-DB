### ===================== Anonymizer configuration (LOCAL-ONLY VALIDATION) =====================
# Purpose: verify the anonymization engine transforms PII correctly, entirely
# on this laptop, with no dependency on the flaky UAT network link.
# Source = a throwaway second local MySQL instance (port 3307) seeded with
# a few sample PII rows. Target = the normal local MySQL (port 3306).
anonymizer.loggingPath=./logs

### Source (throwaway local instance, port 3307)
anonymizer.source.host=127.0.0.1
anonymizer.source.port=3307
anonymizer.source.schemas=db_identity
anonymizer.source.username=root
anonymizer.source.password=

### Target (normal local MySQL, port 3306)
anonymizer.target.host=127.0.0.1
anonymizer.target.port=3306
anonymizer.target.username=root
anonymizer.target.password=sahu@paras30
anonymizer.target.readOnly=false
anonymizer.target.connectionTimeout=30000
anonymizer.target.verifyServerCertificate=true

### Safety
anonymizer.safety.enabled=true
anonymizer.safety.allowedHosts=127.0.0.1

### Rules
anonymizer.rulesFile=src/main/resources/anonymizer/anonymization-registry.yml

### Performance
anonymizer.performance.batchSize=1000
anonymizer.performance.fetchSize=1000
anonymizer.performance.maxMemoryMb=512
