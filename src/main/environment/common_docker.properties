#db_fleet: camp-laptop Fleet-API schema, ONLY on the STOP-TB central server. Migrated only when
#.env has FLEET_ENABLED=true AND FLEET_DATABASE_URL (with FLEET_DATABASE_USERNAME/PASSWORD); everywhere else (state servers, camp
#laptops) both are unset and db.war never touches db_fleet (see DbFleetConfigured).
#FLEET_DATABASE_URL must name an existing db_fleet database or include createDatabaseIfNotExist=true
#(as the other DATABASE_*_URLs do); otherwise the db_fleet migration fails and db.war does not start.
amrit.fleet.enabled=${FLEET_ENABLED:false}
spring.datasource.dbfleet.jdbc-url=${FLEET_DATABASE_URL:}
spring.datasource.dbfleet.username=${FLEET_DATABASE_USERNAME:}
spring.datasource.dbfleet.password=${FLEET_DATABASE_PASSWORD:}
spring.datasource.dbfleet.driver-class-name=com.mysql.cj.jdbc.Driver
